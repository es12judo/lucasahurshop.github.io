<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#11110f">
  <title>Your course — Lucasahur Shop</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#11110f;color:#eeeae2;font:15px/1.7 Arial,sans-serif}
    header,main,footer{max-width:850px;margin:auto;padding:28px 24px}header{border-bottom:1px solid #34332e}
    .brand{color:#c8ae7d;letter-spacing:.18em;font-size:11px;font-weight:bold}main{padding-top:70px;min-height:70vh}
    h1{font:normal clamp(40px,7vw,64px)/1.1 Georgia,serif;letter-spacing:-.04em;margin:18px 0}
    .muted{color:#aaa69d}.lesson{border-top:1px solid #393831;padding:24px 0}.lesson h2{font:normal 25px Georgia,serif;margin:0 0 10px}
    .lesson p{white-space:pre-wrap;color:#c8c3b8}.status{padding:18px;border:1px solid #494438;background:#191916;color:#c8ae7d}
    a{color:#c8ae7d}footer{border-top:1px solid #34332e;color:#88847b;font-size:12px}
  </style>
</head>
<body>
  <header><a class="brand" href="./">LUCASAHUR SHOP</a></header>
  <main>
    <p class="brand">YOUR LEARNING SPACE</p>
    <h1 id="course-title">Loading your course…</h1>
    <p class="muted" id="intro">Checking your private access link.</p>
    <div id="course-content" aria-live="polite"></div>
  </main>
  <footer>Keep your course access link private. <a href="mailto:enzosundberg12@gmail.com">Need help?</a></footer>
  <script src="course-system.js"></script>
  <script src="course-access.js"></script>
</body>
</html>
